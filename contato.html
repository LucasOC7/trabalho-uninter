<!DOCTYPE html>
<html lang="pt-br">
<head>

    <!--Seção do head contendo meta informações e link para o arquivo de estilos-->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="imagem/favicon.ico" type="image/x-icon"> <!--Link do favicon-->

    <title>Contato</title> <!--Definição do título da página "Formação".-->

    <link rel="stylesheet" href="style.css"> <!--Link de Conexão para o arquivo de CSS externo para estilização.-->

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"> <!--Link para icone de menu-->
</head>
<body>

    <!--Cabeçalho contendo a navegação do site.-->

    <header>
        <i id="menu" class="material-icons" onclick="clickMenu()">menu</i> <!--Icone do Menu-->
        <nav id="itens">
            <ul>
                <!--Menu de navegação contendo links para outras seções do site.-->
                <li><a href="index.html">Sobre Mim</a></li>
                <li><a href="formacao.html">Formação</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!--Conteúdo principal contedo informações pessoais.-->

    <main>
        <h1>Contato</h1> <!--Título da Página-->

        <form action="enviar mensagem" method="post"> <!--Formulário para envior de mensagens-->
            <label for="nome">Nome: </label>
            <input type="text" name="nome" id="nome" required> <!--Campo para digitar nome do usuários-->

            <label for="email">Email: </label>
            <input type="text" name="email" id="email" required> <!--Campo para digitar email do usuários-->

            <label for="mensagem">Mensagem: </label>
            <textarea name="mensagem" id="mensagem" rows="4" cols="30" required></textarea> <!--Área do texto-->

            <button id="botao" onclick="alert('Mensagem Enviada!')">Enviar</button> <!--Botão para envio do formulário-->

            <p id="mensagemSucesso"></p>
        </form>
    </main>

    <!--Rodapé contendo informações de direitos-->

    <footer>
        <p>&copy; 2025 Lucas de Oliveira Costa. Todos os direitos reservados.</p>
    </footer>

    <script>
        // Adiciona um evento de clique para abrir e fechar o menu
        function clickMenu() {
            if (itens.style.display == 'block') {
                itens.style.display = 'none'
            } 
            else {
                itens.style.display = 'block'
            }
        }
    </script>

    <script>
        // Seleciona o botão e a mensagem
        const botao = document.getElementById('botao');
        const mensagem = document.getElementById('mensagemSucesso');

        // Adiciona um evento de clique
        botao.addEventListener('click', function() {
            // Altera o estilo para mostrar a mensagem na tela
            mensagem.style.display = 'block';
            
            // Altera o texto do botão para indicar que já foi enviado
            botao.textContent = 'Enviado!';
            botao.disabled = true;
        });
    </script>
</body>
</html>
